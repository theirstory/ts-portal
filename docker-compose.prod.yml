services:
  weaviate:
    image: semitechnologies/weaviate:1.35.0
    container_name: weaviate-prod
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      ENABLE_MODULES: ""
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nlp-processor:
    build:
      context: ./nlp-processor
      dockerfile: Dockerfile
    container_name: nlp-processor-prod
    env_file:
      - ./nlp-processor/.env
    depends_on:
      weaviate:
        condition: service_healthy
    volumes:
      - ./config.json:/config.json:ro
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7070/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  weaviate-init:
    profiles: ["init"]
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: weaviate-init-prod
    env_file:
      - ./.env.production
    environment:
      WEAVIATE_RESET_SCHEMA: "${WEAVIATE_RESET_SCHEMA:-false}"
      RESET_WEAVIATE_DATA: "${RESET_WEAVIATE_DATA:-false}"
      SKIP_IMPORTED_INTERVIEWS: "${SKIP_IMPORTED_INTERVIEWS:-true}"
    depends_on:
      weaviate:
        condition: service_healthy
      nlp-processor:
        condition: service_healthy
    volumes:
      - ./json:/app/json:ro
      - ./config.json:/app/config.json:ro
    command: sh -c "yarn weaviate:generate-schemas && yarn weaviate:import && exit 0"
    restart: "no"

  portal-sync:
    # Pulls published recordings from Portal Publisher (docs/PORTAL_SYNC.md).
    # Idles harmlessly until PORTAL_PUBLISHER_URL and PORTAL_SYNC_TOKEN are set in .env.production.
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: portal-sync-prod
    env_file:
      - ./.env.production
    depends_on:
      weaviate:
        condition: service_healthy
      nlp-processor:
        condition: service_healthy
    volumes:
      - ./json:/app/json
      - ./config.json:/app/config.json:ro
    command: sh -c "yarn portal-sync"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORTAL_SYNC_PORT||7171)+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: next-frontend-prod
    env_file:
      - ./.env.production
    depends_on:
      weaviate:
        condition: service_healthy
      nlp-processor:
        condition: service_healthy
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  weaviate_data:
  huggingface_cache:
